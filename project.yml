name: PiBoard
options:
  bundleIdPrefix: dev.piboard
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "27.0"

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: "1.20.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.10.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    # The bundled Node runtime (scripts/fetch-node.sh) is arm64 only.
    ARCHS: arm64
    # Overridden by scripts/release.sh from the release workflow inputs.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  PiBoard:
    type: application
    platform: macOS
    sources:
      - path: PiBoard
      - path: Runtime/node
        type: folder
        buildPhase: resources
    entitlements:
      path: PiBoard/Resources/PiBoard.entitlements
      properties:
        com.apple.security.app-sandbox: false
    dependencies:
      - package: SwiftTerm
      - package: Sparkle
      - sdk: libsqlite3.tbd
    info:
      path: PiBoard/Resources/Info.plist
      properties:
        CFBundleName: PiBoard
        CFBundleDisplayName: PiBoard
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: ""
        SUFeedURL: https://semiherdogan.github.io/PiBoard/appcast.xml
        # Paste the output of Sparkle's generate_keys here; see docs/RELEASING.md.
        SUPublicEDKey: REPLACE_WITH_SPARKLE_PUBLIC_ED_KEY
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.piboard.PiBoard
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  PiBoardTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PiBoardTests
    dependencies:
      - target: PiBoard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.piboard.PiBoardTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PiBoard:
    build:
      targets:
        PiBoard: all
        PiBoardTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PiBoardTests
